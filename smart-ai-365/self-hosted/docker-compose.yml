services:
  ollama:
    image: ollama/ollama:latest
    container_name: smart-ai-365-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"

  api:
    build: .
    container_name: smart-ai-365-api
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:8b
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      PORT: "8000"
    depends_on:
      - ollama
    ports:
      - "8000:8000"

  model-init:
    image: ollama/ollama:latest
    container_name: smart-ai-365-model-init
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 5; ollama pull qwen3:8b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

volumes:
  ollama_data:
