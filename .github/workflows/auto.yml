name: 🤖 Auto Update Yalla Shoot Every Hour
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update matches
        run: |
          echo "Update $(date)" > last_update.txt
      - name: Commit
        run: |
          git config --global user.name 'Yalla Bot'
          git config --global user.email 'bot@yalla.live'
          git add -A
          git commit -m "Auto update $(date)" || echo "No change"
          git push