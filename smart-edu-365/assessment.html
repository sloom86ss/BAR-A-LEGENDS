<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101014"><title>الاختبار النهائي | دورة الاحترام | SMART EDU 365</title><style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#101014;color:#f8f2e5;font:16px/1.9 Tahoma,Arial,sans-serif}.wrap{max-width:820px;margin:auto}.panel{background:#1b1a20;border:1px solid #6d542b;border-radius:18px;padding:22px;margin:16px 0}.gold{color:#f0cf83}.muted{color:#c8c0b2;font-size:14px}.question{padding:15px 0;border-bottom:1px solid #38343d}.choices{display:grid;gap:9px;margin-top:10px}.choice{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #46404a;border-radius:10px;background:#121218;cursor:pointer}.choice input{accent-color:#e8c16f}button{border:0;border-radius:11px;padding:12px 18px;background:#e8c16f;color:#211707;font:inherit;font-weight:bold;cursor:pointer}.result{padding:15px;border-radius:12px;background:#242019;margin-top:15px}.hidden{display:none}
</style></head><body><main class="wrap"><h1 class="gold">SMART EDU 365</h1><h2>الاختبار النهائي: الاحترام وحُسن التعامل</h2><p class="muted">اختبار واحد باللغة العربية من خمسة أسئلة. تحتاج إلى أربع إجابات صحيحة على الأقل من خمس لفتح الشهادة التحفيزية.</p><section class="panel"><form id="quiz"></form><button id="submit" type="button">تصحيح الاختبار</button><div id="result" class="result hidden" aria-live="polite"></div></section><p class="muted">إذا لم تنجح من المحاولة الأولى، راجع المراحل الأربع ودرس الاستماع ثم أعد الاختبار.</p><p><a href="manners-course.html" style="color:#f0cf83">مراحل الدورة</a> · <a href="certificates.html" style="color:#f0cf83">الشهادة</a></p></main>
<script>
const questions=[
{q:'إذا دخلت الصف صباحاً، ما التصرف المهذب؟',a:['أدخل دون تحية','ألقي السلام وأرد التحية','أرفع صوتي على زملائي'],c:1},
{q:'إذا أردت استخدام غرض يخص صديقك، ماذا تفعل؟',a:['أستأذن أولاً','آخذه دون علمه','أخفيه'],c:0},
{q:'إذا أخطأت في حق شخص، ما التصرف الصحيح؟',a:['ألومه','أتجاهله','أعتذر وأحاول إصلاح الخطأ'],c:2},
{q:'إذا اختلفت مع صديقك، كيف تتصرف؟',a:['أسخر منه','أتحاور بهدوء وأبحث عن حل عادل','أؤذيه'],c:1},
{q:'إذا شاهدت تنمراً على زميل، ماذا تفعل؟',a:['أشارك في السخرية','أصمت دائماً','لا أشارك وأخبر شخصاً بالغاً موثوقاً'],c:2}
];
const quiz=document.getElementById('quiz'),result=document.getElementById('result');quiz.innerHTML=questions.map((q,i)=>'<div class="question"><b>'+(i+1)+'. '+q.q+'</b><div class="choices">'+q.a.map((v,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"><span>'+v+'</span></label>').join('')+'</div></div>').join('');
document.getElementById('submit').onclick=()=>{let score=0,answered=0;questions.forEach((q,i)=>{const v=quiz.querySelector('input[name="q'+i+'"]:checked');if(v){answered++;if(Number(v.value)===q.c)score++;}});if(answered!==5){result.textContent='أجب عن الأسئلة الخمسة أولاً. أجبت عن '+answered+' من 5.';result.classList.remove('hidden');return;}const passed=score>=4;sessionStorage.setItem('smartEdu365Assessment',JSON.stringify({track:'manners',score,total:5,passed,level:'manners',at:Date.now()}));result.innerHTML='<b>'+(passed?'أحسنت! اجتزت الاختبار النهائي ⭐':'واصل التعلم ثم أعد المحاولة')+'</b><br>نتيجتك '+score+' من 5 ('+(score*20)+'٪). '+(passed?'<a href="certificates.html" style="color:#f0cf83">انتقل إلى الشهادة</a>':'تحتاج إلى 4 إجابات صحيحة للنجاح.');result.classList.remove('hidden');};
</script></body></html>
