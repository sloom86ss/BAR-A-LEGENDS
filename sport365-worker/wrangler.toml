name = "sport365-api"
main = "src/index.js"
compatibility_date = "2026-11-06"

[vars]
ALLOWED_ORIGIN = "https://sloom86ss.github.io"
# Optional comma-separated OpenLigaDB competition shortcuts.
OPENLIGADB_LEAGUES = "bl1,bl2,bl3,dfb"
# Optional season start year; otherwise inferred from current date.
# OPENLIGADB_SEASON = "2026"

[triggers]
crons = ["*/2 * * * *"]
