<meta charset="UTF-8">

<title>BARÇA LEGENDS - Animated Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#050a1e;color:#fff;overflow-x:hidden}
.bg-move{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 30% 20%, rgba(0,77,152,.25), transparent 40%),radial-gradient(circle at 80% 70%, rgba(165,0,68,.25), transparent 40%),#050a1e;animation:bgShift 10s infinite alternate}
@keyframes bgShift{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(15deg)}}
.logo-wm{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:280px;opacity:.03;animation:floatLogo 6s infinite ease-in-out;pointer-events:none}
@keyframes floatLogo{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-55%) scale(1.05)}}
.top{background:linear-gradient(90deg,#001a4d,#a50044);padding:18px;text-align:center;position:sticky;top:0;z-index:10;border-bottom:3px solid gold}
.top h1{font-size:24px;font-weight:900}.top h1 b{color:gold}
.grid{padding:14px;display:grid;gap:18px;max-width:680px;margin:auto}
.card{position:relative;background:rgba(18,25,59,.85);backdrop-filter:blur(10px);border:1px solid rgba(255,215,0,.25);border-radius:24px;overflow:hidden;animation:cardIn .6s both;box-shadow:0 12px 30px rgba(0,0,0,.4)}
@keyframes cardIn{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.img-box{height:260px;overflow:hidden;position:relative}
.img-box img{width:100%;height:100%;object-fit:cover;animation:kenburns 12s infinite alternate ease-in-out}
.card:hover .img-box img{transform:scale(1.15)}
@keyframes kenburns{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.18) translate(-10px,-10px)}}
.shine{position:absolute;inset:0;background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%);transform:translateX(-100%);animation:shineMove 3s infinite}
@keyframes shineMove{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.badge{position:absolute;top:14px;right:14px;z-index:2;background:linear-gradient(90deg,gold,#ffae00);color:#000;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:900;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.body{padding:14px 16px 18px}.body h3{font-size:19px;font-weight:900}.body h3 span{color:gold;font-size:12px;display:block}
.preview{font-size:12.5px;color:#aab2d6;margin-top:6px}
.story{margin-top:12px;background:rgba(0,0,0,.35);border-right:3px solid gold;border-radius:12px;padding:14px;font-size:13.5px;line-height:1.9;color:#d8dcff;max-height:0;overflow:hidden;transition:max-height .6s ease}
.card.open .story{max-height:1000px}
.btn{width:100%;margin-top:12px;background:linear-gradient(90deg,#004d98,#a50044);border:1px solid gold;color:#fff;padding:11px;border-radius:12px;font-weight:900;cursor:pointer}
</style>
</head>
