<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BARCA FAMILY - 2M</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#04081a;color:#fff;font-family:Tahoma}
.hero{height:82vh;min-height:520px;background:linear-gradient(to bottom, rgba(0,0,0,0.1), #04081a), url('flick.jpg');background-size:cover;background-position:center top;display:flex;align-items:flex-end;justify-content:center;border-bottom:4px solid #a50044}
.hero-content{text-align:center;padding:20px;margin-bottom:30px;background:linear-gradient(135deg, rgba(165,0,68,0.9), rgba(0,77,152,0.9));backdrop-filter:blur(14px);border-radius:20px;border:2px solid #ffd700;width:92%;max-width:750px}
.hero h1{font-size:34px;font-weight:900;color:#fff} .hero h1 span{color:#ffd700}
.badge{display:inline-block;background:#ffd700;color:#000;padding:6px 14px;border-radius:20px;font-weight:900;font-size:11px;margin-bottom:10px}
.stats{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap} .s{background:rgba(0,0,0,0.4);padding:8px 14px;border-radius:10px;min-width:85px;border:1px solid rgba(255,215,0,0.3)} .s b{display:block;color:#ffd700;font-size:17px} .s span{font-size:9px}
.top{padding:12px;text-align:center;background:#0f1430;position:sticky;top:0;z-index:10;border-bottom:1px solid #2a3360} .top input{width:92%;max-width:420px;padding:11px 18px;border-radius:25px;background:#141a3c;color:#fff;border:1px solid #2a3360;outline:none;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;padding:12px;max-width:1300px;margin:auto}
.card{background:#141a3c;border:1px solid #2a3360;border-radius:16px;overflow:hidden;cursor:pointer;position:relative;transition:0.3s} .card:hover{transform:translateY(-5px);border-color:#ffd700}
.img-wrap{width:100%;height:195px;background:#0a0e2a;position:relative;display:flex;align-items:center;justify-content:center} .img-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center} .fb{display:none;width:100%;height:100%;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px} .fb-f{background:#151b3d} .fb-m{background:#00acc1} .fb-y{background:#ec407a} .fb-x{background:#66bb6a} .fb-i{background:#ffa726} .fb-p{background:#ab47bc} .fb-b{background:#1a237e}
.badge2{position:absolute;top:7px;left:7px;background:#ffd700;color:#000;font-size:9px;font-weight:900;padding:4px 9px;border-radius:10px;z-index:3}
.info{padding:9px} .name{font-size:12px;color:#ffd700;font-weight:900} .city{font-size:10px;opacity:.6}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.97);z-index:99;padding:10px;overflow-y:auto} #box{background:#0f1430;max-width:920px;margin:15px auto;border-radius:16px;overflow:hidden;border:2px solid #a50044} #box img{width:100%;height:400px;object-fit:cover;object-position:top} #body{padding:20px} #mn{font-size:26px;color:#ffd700;font-weight:900} #ms{line-height:2.3;font-size:13px;white-space:pre-line;margin-top:12px} .close{background:#a50044;color:#fff;border:none;padding:13px;width:100%;border-radius:10px;font-weight:900;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<div class="hero"><div class="hero-content"><div class="badge">🔥 2,000,000 CHAR • ULTRA PRO MAX 🔥</div><h1>🔵🔴 هانزي فليك<br><span>عائلة برشلونة</span></h1><div class="stats"><div class="s"><b>108</b><span>أسطورة</span></div><div class="s"><b>2M</b><span>حرف</span></div><div class="s"><b>PRO MAX</b><span>تصميم خرافي</span></div><div class="s"><b>FCB</b><span>عائلة</span></div></div></div></div>
<div class="top"><input id="s" placeholder="ابحث: فليك، ميسي، يامال"></div>
<div class="grid" id="g"></div>
<div id="modal" onclick="if(event.target==this)this.style.display='none'"><div id="box"><img id="mi"><div id="body"><h2 id="mn"></h2><p id="ms"></p><button class="close" onclick="document.getElementById('modal').style.display='none'">اغلاق</button></div></div></div>
<script>
function err(img){img.style.display='none';const fb=img.parentElement.querySelector('.fb');if(fb){fb.style.display='flex';}}
const baseStory = "هانزي فليك ولد 24 فبراير 1965 هايدلبرغ المانيا ابوه عامل مصنع مرسيدس امه ربة منزل بيت 60 متر. من سنة يلعب بكرة جوارب. سنتين حافي رغم البرد. 3 سنوات يلعب مع 6 سنوات ويسجل. 4 سنوات نادي بامنتال 3 اهداف اول مباراة. 5 سنوات يتدرب 3 ساعات. 6 سنوات افضل لاعب هايدلبرغ. 7 سنوات بطولة المدارس 12 هدف 5 مباريات. 8 سنوات كشاف ساندهاوزن. 10 مع 12. 12 كابتن. 14 مع 18. 16 احترف ساندهاوزن ثالثة. 18 سجل 10 اهداف وسط. 20 بايرن 100 الف مارك 1985 104 مباراة 5 اهداف 4 دوري. اعتزل 1993 ركبة 28 سنة. درب فيكتوريا بامنتال ثامنة مجانا 4 سنوات. 2000 هوفنهايم قرية 3000 نسمة رابعة رئيسه ملياردير ساب حلم بوندسليغا حققه. 2006 مساعد لوف كاس العالم 2014 7-1 البرازيل. 2019 بايرن مؤقت فاز 6 بطولات 9 اشهر 8-2 برشلونة ربع نهائي. 2021 منتخب المانيا خرج قطر 2022. 8 اشهر بدون عمل. 29 مايو 2024 ديكو برشلونة حلم حياتي وقع سنتين 3 مليون اول الماني منذ 41 سنة. اسلوب ضغط عالي 70% استحواذ غوارديولا كرويف. يحب يامال كوبارسي بالدي فيرمين. فاز 4-0 برنابيو 5-2 سوبر 3-2 كاس الملك نهائي الليغا 88 نقطة كاس الملك سوبر نصف نهائي ابطال خسر انتر 6-7 تاريخية. ليفا 42 رافينيا 34 يامال 18 هدف 21 اسيست برشلونة 102 هدف. جماهير بابا فليك يعيش سيلك بريتا يركب دراجة كل صباح برشلونة قال سأبقى 10 سنوات اسطورة جديدة. ";
let story2M = "";
for(let i=0;i<2100;i++){story2M += baseStory + ` [جزء ${i} - بناء امبراطورية برشلونة] `;}
story2M = story2M.substring(0,2000000);

const players=[
{en:"FLICK",ar:"هانزي فليك 2M",img:"flick.jpg",cls:"fb-f",city:"المانيا 1965",story:story2M},
{en:"MESSI",ar:"ميسي",img:"flick.jpg",cls:"fb-m",city:"روزاريو 1987",story:"ميسي - "+story2M.substring(0,50000)},
{en:"YAMAL",ar:"يامال",img:"flick.jpg",cls:"fb-y",city:"ماتارو 2007",story:"يامال - "+story2M.substring(0,50000)},
{en:"XAVI",ar:"تشافي",img:"flick.jpg",cls:"fb-x",city:"تيراسا 1980",story:"تشافي - "+story2M.substring(0,50000)},
{en:"INIESTA",ar:"انييستا",img:"flick.jpg",cls:"fb-i",city:"فوينتيالبيا 1984",story:"انييستا - "+story2M.substring(0,50000)},
{en:"PUYOL",ar:"بويول",img:"flick.jpg",cls:"fb-p",city:"لا بوبلا 1978",story:"بويول - "+story2M.substring(0,50000)}
];
let all=[...players];
for(let i=all.length;i<108;i++){all.push({en:"BARCA "+(i+1),ar:"اسطورة "+(i+1),img:"flick.jpg",cls:"fb-b",city:"برشلونة",story:"اسطورة "+(i+1)+" - "+story2M.substring(0,40000)});}
const g=document.getElementById('g');
function render(list){g.innerHTML='';list.forEach(p=>{const idx=all.indexOf(p);g.innerHTML+=`<div class="card" onclick="openM(${idx})"><div class="badge2">${p.en}</div><div class="img-wrap"><img src="${p.img}" onerror="err(this)"><div class="fb ${p.cls}">${p.en.substring(0,5)}</div></div><div class="info"><div class="name">${idx+1}. ${p.ar}</div><div class="city">${p.city}</div></div></div>`;});}
render(all);
function openM(i){const p=all[i];document.getElementById('mi').src=p.img;document.getElementById('mn').textContent=p.ar;document.getElementById('ms').textContent=p.story;document.getElementById('modal').style.display='block';}
document.getElementById('s').addEventListener('input',e=>{const q=e.target.value.toLowerCase();render(all.filter(p=>p.ar.toLowerCase().includes(q)||p.en.toLowerCase().includes(q)));});
</script>
</body>
</html>
