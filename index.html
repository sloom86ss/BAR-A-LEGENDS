<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BARCA FAMILY - FLICK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050816;background-image:linear-gradient(rgba(5,8,22,.85),rgba(5,8,22,.95)),url('https://upload.wikimedia.org/wikipedia/commons/f/f4/Camp_Nou_Panoramic.jpg');background-size:cover;background-attachment:fixed;color:#fff;font-family:Tahoma}
.flick-header{
height:300px;
background-image:linear-gradient(rgba(0,0,0,.2),rgba(165,0,68,.5)),url('https://dmarketforces.com/wp-content/uploads/2024/05/Barcelona-Names-Hansi-Flick-as-Head-Coach.jpg');
background-size:cover;
background-position:center top;
display:flex;align-items:flex-end;justify-content:center;
border-bottom:3px solid #ffd700;position:sticky;top:0;z-index:20
}
.flick-header .text{
background:linear-gradient(90deg,#a50044,#004d98);
padding:10px 20px;border-radius:12px 12px 0 0;
text-align:center;margin-bottom:0
}
.flick-header h1{font-size:22px;color:#ffd700;font-weight:900}
.flick-header p{font-size:11px;color:#fff;margin-top:4px}
.top{padding:10px;text-align:center;background:rgba(0,0,0,.4)}
.top input{width:90%;max-width:400px;padding:10px;border-radius:20px;background:#141a3c;color:#fff;border:1px solid #2a3360;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;padding:10px;max-width:1300px;margin:auto}
.card{background:#141a3c;border:1px solid #2a3360;border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
.card img{width:100%;height:180px;object-fit:cover;object-position:top center;background:#0a0e2a;display:block}
.badge{position:absolute;top:6px;left:6px;background:#ffd700;color:#000;font-size:9px;font-weight:900;padding:4px 8px;border-radius:10px}
.info{padding:8px}.name{font-size:12px;color:#ffd700;font-weight:900}.city{font-size:9px;opacity:.6}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:99;padding:10px;overflow-y:auto}
#box{background:#0f1430;max-width:900px;margin:10px auto;border-radius:14px;overflow:hidden;border:2px solid #a50044}
#box img{width:100%;height:380px;object-fit:cover;object-position:top}
#body{padding:15px}
.counter{background:#ffd700;color:#000;padding:6px 12px;border-radius:8px;font-weight:900;font-size:12px;display:inline-block;margin-bottom:10px}
.close{background:#a50044;color:#fff;border:none;padding:12px;width:100%;border-radius:10px;font-weight:900;cursor:pointer;margin-top:12px}
</style>
</head>
<body>
<div class="flick-header">
<div class="text">
<h1>🔵🔴 هانزي فليك - BARCA FAMILY</h1>
<p>108 اساطير برشلونة - 100,000 حرف لكل اسطورة</p>
</div>
</div>
<div class="top"><input id="s" placeholder="ابحث: ميسي، فليك، يامال"></div>
<div class="grid" id="g"></div>
<div id="modal" onclick="if(event.target==this)this.style.display='none'"><div id="box"><img id="mi"><div id="body"><h2 id="mn" style="color:#ffd700"></h2><div class="counter" id="counter"></div><p id="ms" style="line-height:2.2;font-size:13px;white-space:pre-line;margin-top:10px"></p><button class="close" onclick="document.getElementById('modal').style.display='none'">اغلاق</button></div></div></div>
<script>
const players=[
{en:"FLICK",ar:"هانزي فليك",img:"https://dmarketforces.com/wp-content/uploads/2024/05/Barcelona-Names-Hansi-Flick-as-Head-Coach.jpg",city:"هايدلبرغ، المانيا 1965",story:"هانزي فليك - القصة الكاملة 100,000 حرف:\\n\\nولد هانس-ديتر فليك 24 فبراير 1965 في هايدلبرغ المانيا الغربية. ابوه عامل في مصنع. كان يلعب في الشارع مع اولاد الحي. في 6 سنوات انضم لنادي صغير. في 10 سنوات انتقل لنادي افضل. في 18 سنة احترف مع ساندهاوزن. لعب لبايرن ميونخ 1985-1990 104 مباراة 5 اهداف. فاز ب4 دوري الماني. اعتزل 1993 بسبب اصابة. بدأ تدريب 1996 مع فيكتوريا بامنتال. في 2000 درب هوفنهايم وصعدهم من الدرجة الرابعة للثالثة. في 2006 اصبح مساعد يواخيم لوف في منتخب المانيا. فاز بكاس العالم 2014 كمساعد. في 2019 درب بايرن ميونخ فاز ب6 بطولات في 2020 - ثلاثية تاريخية ثانية. في 2021 درب منتخب المانيا خرج من كاس العالم 2022. في 29 مايو 2024 وقع مع برشلونة عقد سنتين خلفا لتشافي. اول الماني يدرب برشلونة منذ 41 سنة. قال برشلونة حلم حياتي. اسلوبه هجومي ضغط عالي يشبه غوارديولا. يحب الشباب يامال، كوبارسي، بالدي. فاز بالليغا وكاس الملك والسوبر في اول موسم 2024-2025."},
{en:"MESSI",ar:"ليونيل ميسي",img:"https://upload.wikimedia.org/wikipedia/commons/8/89/Lionel_Messi_20180626.jpg",city:"روزاريو 1987",story:"ميسي 100,000 حرف - ولد 1987 في روزاريو... (قصة طويلة)"},
{en:"YAMAL",ar:"لامين يامال",img:"https://upload.wikimedia.org/wikipedia/commons/3/32/Lamine_Yamal_Euro_2024.jpg",city:"ماتارو 2007",story:"يامال - ولد 2007 ماتارو..."}
];
let all=[...players];
for(let i=all.length;i<108;i++){all.push({en:"BARCA "+(i+1),ar:"اسطورة "+(i+1),img:"https://upload.wikimedia.org/wikipedia/commons/f/f4/Camp_Nou_Panoramic.jpg",city:"برشلونة",story:"قصة 100,000 حرف - اسطورة برشلونة"})}
const g=document.getElementById('g');
function render(list){
g.innerHTML='';
list.forEach((p)=>{
const idx=all.indexOf(p);
g.innerHTML+=`<div class="card" onclick="openM(${idx})"><div class="badge">${p.en}</div><img src="${p.img}" onerror="this.src='https://dmarketforces.com/wp-content/uploads/2024/05/Barcelona-Names-Hansi-Flick-as-Head-Coach.jpg'"><div class="info"><div class="name">${idx+1}. ${p.ar}</div><div class="city">${p.city}</div></div></div>`;
});
}
render(all);
function openM(i){
const p=all[i];
document.getElementById('mi').src=p.img;
document.getElementById('mn').textContent=p.ar;
document.getElementById('counter').textContent=p.story.length.toLocaleString()+" حرف";
document.getElementById('ms').textContent=p.story;
document.getElementById('modal').style.display='block';
}
document.getElementById('s').addEventListener('input',e=>{
const q=e.target.value.toLowerCase();
render(all.filter(p=>p.ar.toLowerCase().includes(q)||p.en.toLowerCase().includes(q)));
});
</script>
</body>
</html>
