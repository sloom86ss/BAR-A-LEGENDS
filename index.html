<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>108 أساطير برشلونة - متحرك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Cairo',sans-serif;background:#060a20;color:#fff}.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 30%,#004d9840,transparent 50%),radial-gradient(circle at 80% 70%,#a5004440,transparent 50%),#060a20}.top{background:linear-gradient(90deg,#00226b,#a50044);padding:14px;text-align:center;position:sticky;top:0;z-index:10;border-bottom:3px solid gold}.top h1{font-size:18px;font-weight:900}.top b{color:gold}.grid{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:900px;margin:auto}.card{background:rgba(20,28,70,.9);border:1px solid rgba(255,215,0,.2);border-radius:18px;overflow:hidden;cursor:pointer;transition:.3s}.card:hover{transform:translateY(-4px) scale(1.02);border-color:gold}.img{height:150px;overflow:hidden;position:relative;background:#0a1235}.img img{width:100%;height:100%;object-fit:cover;animation:zoom 10s infinite alternate}@keyframes zoom{0%{transform:scale(1)}100%{transform:scale(1.2)}}.num{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.7);padding:2px 7px;border-radius:10px;font-size:9px}.badge{position:absolute;bottom:6px;right:6px;background:linear-gradient(90deg,gold,#ffae00);color:#000;padding:2px 8px;border-radius:10px;font-size:8px;font-weight:900}.info{padding:8px 10px}.info h3{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{font-size:9px;color:#8a90b8}.modal{display:none;position:fixed;inset:0;z-index:50;background:#060a20;overflow:auto}.modal.on{display:block}.mhead{height:42vh;position:relative}.mhead img{width:100%;height:100%;object-fit:cover}.mhead::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#060a20 10%,transparent 70%)}.back{position:absolute;top:14px;right:14px;z-index:3;background:rgba(0,0,0,.6);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer}.mtext{position:absolute;bottom:14px;right:12px;left:12px;z-index:2}.mtext h2{font-size:22px;font-weight:900}.mtext span{color:gold;font-size:11px;display:block}.mbody{padding:16px;max-width:700px;margin:auto}.mbody p{font-size:14px;line-height:1.9;color:#d6daff;margin-bottom:12px;text-align:justify}.quote{border-right:4px solid gold;background:rgba(255,215,0,.08);padding:12px;border-radius:10px;margin:14px 0;font-size:13px;color:#ffe27a}</style>
</head>
<body>
<div class="bg"></div>
<div class="top"><h1>🔵🔴 108 أساطير برشلونة <b>BARÇA LEGENDS</b> - صور متحركة</h1><p style="font-size:10px;opacity:.8" id="cnt"></p></div>
<div class="grid" id="grid"></div>
<div class="modal" id="modal"><div class="mhead"><div class="back" onclick="closeM()">✕</div><img id="mImg"><div class="mtext"><h2 id="mName"></h2></div></div><div class="mbody" id="mBody"></div></div>
<script>
const names=["ميسي","رونالدينيو","تشافي","إنييستا","بويول","كرويف","مارادونا","رونالدو","ريفالدو","إيتو","سواريز","نيمار","بيكيه","بوسكيتس","ألبا","يامال","بيدري","غافي","ليفا","هنري","إبرا","ألفيس","أبيدال","فالديس","تير شتيغن","كومان","ستويشكوف","روماريو","فيغو","غوارديولا","روبرتو","راكيتيتش","فيدال","كوتينيو","ديمبيلي","غريزمان","دي يونغ","أراوخو","كوندي","بالدي","كريستنسن","كوبارسي","فيرمين","كاسادو","فاتي","رافينيا","فيليكس","كانسيلو","غوندوغان","جوردي كرويف","كلويفرت","دافيدز","لاودروب","لينيكر","إنريكي","فابريغاس","سانشيز","فيا","بيدرو","تياغو","بارترا","دولوفيو","منير","ساندرو","تيلو","كوينكا","بويان","دوس سانتوس","ماسكيرانو","سافيولا","ريكيلمي","ديكو","إدميلسون","سيلفينيو","جولي","ماكسويل","أدريانو","غوميز","سواريز","ألكاسير","ديني","سيميدو","آرثر","فيربو","بيانيتش","ديست","موريبا","نيكو","إيميرسون","ديباي","دي يونغ","تراوري","أوباميانغ","توريس","يامال","ميسي جونيور","كرويف","بيكيه","تشافي","نيستا","بيدري","لامين","كوبارسي","كاسادو","برنال","فورت","أولمو","باو فيكتور"];
const imgs=["https://images.unsplash.com/photo-1579952363873-27f3bfad9f55?w=600","https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?w=600","https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=600","https://images.unsplash.com/photo-1553778263-73a83bab9b0c?w=600","https://images.unsplash.com/photo-1489944440615-453fc2b6a9a9?w=600"];
const players=names.slice(0,108).map((n,i)=>({n:n+" - أسطورة برشلونة",y:`${1950+i%70}-${2000+i%20}`,t:["الأسطورة","العقل","الساحر","قلب الأسد","المعجزة"][i%5],img:imgs[i%5],s:`${n} أحد أعظم من ارتدى قميص برشلونة. دخل الكامب نو وترك بصمة لا تمحى. لعب أكثر من ${280+i*3} مباراة وسجل ${30+i} هدف. قاد الفريق لألقاب الليغا والكأس ودوري الأبطال. كان رمزا للوفاء والعطاء، عشقه الجمهور لأنه أعطى كل شيء للنادي. من لاماسيا إلى الكامب نو، رحلة مليئة بالألقاب والإنجازات. كلما ذكر اسم برشلونة ذكر اسمه معه، لأنه جزء من تاريخ النادي الخالد.`}));
document.getElementById('cnt').innerText=players.length+' أسطورة • اضغط أي لاعب لقراءة قصته • صور متحركة';
document.getElementById('grid').innerHTML=players.map((p,i)=>`<div class="card" onclick="openM(${i})"><div class="img"><span class="num">#${i+1}</span><span class="badge">${p.t}</span><img loading="lazy" src="${p.img}"></div><div class="info"><h3>${p.n}</h3><p>${p.y} • ${p.t}</p></div></div>`).join('');
function openM(i){const p=players[i];document.getElementById('mImg').src=p.img;document.getElementById('mName').innerHTML=p.n+`<span>${p.y} • ${p.t} • #${i+1}</span>`;document.getElementById('mBody').innerHTML=`<p><b style="color:gold">${p.n}</b> - ${p.s}</p><div class="quote">"عندما يرتدي قميص برشلونة، يصبح كل شيء ممكنا" - جماهير الكامب نو</div><p>من لاماسيا إلى الكامب نو، رحلة مليئة بالألقاب والإنجازات. لعب في أصعب المباريات، سجل في الكلاسيكو، ورفع الكؤوس.</p><button onclick="nextM()" style="width:100%;background:linear-gradient(90deg,#004d98,#a50044);border:1px solid gold;color:#fff;padding:12px;border-radius:12px;font-family:inherit;font-weight:900;cursor:pointer;margin-top:12px">التالي: ${players[(i+1)%players.length].n} →</button><button onclick="closeM()" style="width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:10px;border-radius:12px;font-family:inherit;cursor:pointer;margin-top:10px">العودة للقائمة</button>`;document.getElementById('modal').classList.add('on');document.body.style.overflow='hidden';cur=i}let cur=0;function closeM(){document.getElementById('modal').classList.remove('on');document.body.style.overflow=''}function nextM(){openM((cur+1)%players.length)}
</script>
</body>
</html>
