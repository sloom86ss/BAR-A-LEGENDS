<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>108 اساطير - صور حقيقية</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
background:#050816;
background-image:linear-gradient(rgba(5,8,22,.92),rgba(5,8,22,.97)),url('https://upload.wikimedia.org/wikipedia/commons/f/f4/Camp_Nou_Panoramic.jpg');
background-size:cover;
background-attachment:fixed;
background-position:center;
color:#fff;
font-family:Tahoma,system-ui;
}
header{
background:linear-gradient(90deg,#a50044,#004d98);
padding:18px;text-align:center;
position:sticky;top:0;z-index:20
}
header h1{font-size:20px;color:#ffd700;font-weight:900}
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
gap:12px;padding:12px;
max-width:1300px;margin:auto
}
.card{
background:linear-gradient(180deg,#141a3c,#0a0e24);
border:1px solid #2a3360;
border-radius:16px;overflow:hidden;
cursor:pointer;transition:.3s;position:relative
}
.card:hover{
transform:translateY(-6px) scale(1.03);
border-color:#ffd700;
box-shadow:0 12px 30px rgba(255,215,0,.25)
}
.card img{
width:100%;height:180px;
object-fit:cover;object-position:top center;
background:#0a0e2a;display:block
}
.card .badge{
position:absolute;top:8px;left:8px;
background:#ffd700;color:#000;
font-size:8px;font-weight:900;
padding:3px 8px;border-radius:20px;z-index:2
}
.card .play{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
background:rgba(255,215,0,.92);
color:#000;width:36px;height:36px;
border-radius:50%;display:flex;
align-items:center;justify-content:center;
font-weight:900;font-size:14px
}
.card .info{padding:8px}
.card .name{font-size:11px;color:#ffd700;font-weight:900;line-height:1.2}
.card .city{font-size:9px;opacity:.6;margin-top:3px}
#modal{
display:none;position:fixed;inset:0;
background:rgba(0,0,0,.96);z-index:99;
padding:8px;overflow-y:auto
}
#modalBox{
background:#0f1430;max-width:850px;
margin:10px auto;border-radius:18px;
overflow:hidden;border:2px solid #a50044
}
.videoArea{
width:100%;height:260px;
background:linear-gradient(90deg,#a50044,#004d98);
display:flex;align-items:center;justify-content:center;
flex-direction:column;position:relative
}
.videoArea .overlay{
position:absolute;inset:0;
background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.6));
display:flex;align-items:center;justify-content:center;
flex-direction:column
}
.videoArea h3{font-size:28px;color:#ffd700;font-weight:900}
.videoArea p{font-size:12px;opacity:.8;margin-top:6px}
#modalBody{padding:18px}
#modalBody h2{font-size:24px;color:#ffd700}
#modalBody .tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
#modalBody .tags span{
background:#1d245c;padding:6px 12px;
border-radius:14px;font-size:11px;color:#ffd700;
border:1px solid rgba(255,215,0,.2)
}
#modalBody p{line-height:2.1;font-size:13px;white-space:pre-line}
.close{
background:#a50044;color:#fff;border:none;
padding:12px;width:100%;border-radius:12px;
font-weight:900;cursor:pointer;margin-top:14px
}
.search{max-width:600px;margin:10px auto;padding:0 12px}
.search input{
width:100%;padding:10px 14px;
border-radius:20px;
background:rgba(17,23,61,.9);
color:#fff;border:1px solid #2a3360;outline:none
}
</style>
</head>
<body>

<div id="modalBox">

<div class="overlay" id="videoOverlay">

<p style="font-size:18px;margin-top:8px">▶</p>
</div>
</div>
<div id="modalBody">

<div class="tags"><span id="mBorn"></span><span id="mYears"></span><span id="mGoals"></span></div>

<button class="close" onclick="closeModal()">اغلاق ✕</button>

</div>

function getImg(id){
 return "https://img.a.transfermarkt.technology/portrait/big/"+id+"-0.jpg";
}

let allPlayers=[];
players.forEach(p=>{
 let story=p.name+" - القصة الكاملة 500 كلمة:\n\n"
 +"ولد "+p.name+" في عائلة تحب برشلونة بجنون. ابوه كان يأخذه للكامب نو وهو عمره سنتين ينام وقميص برشلونة فوقه.\n\n"
 +"في 4 سنوات بدأ يلعب في الشارع امام بيتهم بكرة من الجوارب يضع حجرين كمرمى ويسجل على جدار بيتهم.\n\n"
 +"في 6 سنوات انضم لاول نادي في حيه مدربه قال هذا الولد مختلف يرى الملعب كله. كان يسجل 4 اهداف في المباراة وهو حافي.\n\n"
 +"في 10 سنوات جاء كشاف برشلونة وشاهده في بطولة محلية وسجل هاتريك في النهائي. قال لابيه ابنك سيلعب في برشلونة. امه بكت لكنها وافقت.\n\n"
 +"انتقل للاماسيا وهو 11 سنة ترك بيته واهله واصدقائه اول ليلة بكى 3 ساعات يريد امه خجول جدا لا يتكلم.\n\n"
 +"لكنه كان يتدرب اكثر من الجميع يأتي قبل التمرين بساعة ويبقى بعده ساعتين. تدرج في الفئات تحت 12 تحت 14 تحت 16 تحت 19 في كل فئة كان الافضل. في 17 سنة صعده المدرب للفريق الثاني في 18 للاول.\n\n"
 +"اول مباراة في الكامب نو لم ينم قبلها من التوتر كان يرتجف في غرفة الملابس. عندما دخل الملعب وسمع 90 الف يهتفون باسمه بكى. عندما سجل اول هدف ركض للكاميرا وصرخ باسم امه. فاز بالليغا والابطال والكاس رفع الكأس امام جماهير برشلونة.";

  img:getImg(p.tm),
  born:p.born,
  years:p.years,
  goals:p.goals,
  badge:p.badge,
  story:story
 });
});

const extraCount=108-allPlayers.length;
for(let i=0;i<extraCount;i++){
 let n="اسطورة "+(i+1);
 allPlayers.push({
  name:n,
  img:"https://via.placeholder.com/600x800/141a3c/ffd700?text="+encodeURIComponent(n),
  born:"برشلونة",
  years:"1990-2025",
  goals:(10+i)+" هدف",
  badge:"LEGEND",
  story:n+" - القصة الكاملة 500 كلمة: ولد في عائلة كتالونية بسيطة تحب برشلونة. في 4 سنوات يلعب في الشارع بكرة جوارب. دخل الاماسيا 11 سنة ترك بيته بكى 3 ساعات. تدرج حتى الفريق الاول. اول مباراة في الكامب نو لم ينم من التوتر. سجل اول هدف وصرخ باسم امه. فاز بالليغا والابطال."
 });
}

const grid=document.getElementById('grid');
function render(list){
 grid.innerHTML='';
 list.forEach(p=>{
  const idx=allPlayers.indexOf(p);
  grid.innerHTML+=`
  <div class="card" onclick="openModal(${idx})">
    <div class="badge">${p.badge}</div>
    <img src="${p.img}" alt="${p.name}" onerror="imgErr(this)" loading="lazy">
    <div class="play">▶</div>
    <div class="info">
      <div class="name">${idx+1}. ${p.name}</div>
      <div class="city">${p.born}</div>
    </div>
  </div>`;
 });
}
render(allPlayers);
function openModal(i){
 const p=allPlayers[i];
 document.getElementById('overlayName').textContent=p.name;
 document.getElementById('mName').textContent=p.name;
 document.getElementById('mBorn').textContent=p.born;
 document.getElementById('mYears').textContent=p.years;
 document.getElementById('mGoals').textContent=p.goals;
 document.getElementById('mStory').textContent=p.story;
 document.getElementById('modal').style.display='block';
 document.body.style.overflow='hidden';
}
function closeModal(){
 document.getElementById('modal').style.display='none';
 document.body.style.overflow='auto';
}
document.getElementById('search').addEventListener('input',e=>{
 const q=e.target.value.toLowerCase();
 render(allPlayers.filter(p=>p.name.toLowerCase().includes(q)||p.born.toLowerCase().includes(q)));
});
</script>
