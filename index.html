<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أساطير برشلونة</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e27;color:#fff;font-family:system-ui} .header{background:linear-gradient(135deg,#a50044,#004d98);padding:18px;text-align:center} .header h1{color:#ffed00;font-size:22px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px} .card{background:#1a1f4d;border-radius:14px;padding:12px;text-align:center;border:1px solid #2a3266} .card h3{color:#ffed00;margin-top:6px}</style></head><body><div class="header"><h1>BARÇA LEGENDS 🔵🔴<br>أساطير برشلونة</h1><p>100 أسطورة</p></div><div class="grid" id="g"></div><script>const L=[["ميسي","🐐"],["تشافي","🧠"],["إنييستا","🎩"],["بويول","🦁"],["سواريز","🦷"],["رونالدينيو","😁"],["بيدري","✨"],["يامال","🌟"]];document.getElementById('g').innerHTML=L.map(x=>`<div class="card"><div style="font-size:36px">${x[1]}</div><h3>${x[0]}</h3></div>`).join('')</script></body></html>
