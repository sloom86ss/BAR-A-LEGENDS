<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>يلا شوت LIVE - يتحدث تلقائيا</title><style>:root{--bg:#070712;--card:#14142e;--b:#2a2a66;--g:#00ff88;--r:#ff123e;--y:#ffcc00}*{margin:0;box-sizing:border-box;font-family:Tajawal}body{background:var(--bg);color:#fff}.top{height:4px;background:linear-gradient(90deg,var(--r),var(--y),var(--g),#00aaff,var(--r))}.head{background:linear-gradient(#17173a,#0a0a1a);padding:12px;text-align:center;position:sticky;top:0;z-index:10;border-bottom:2px solid var(--b)}.status-bar{background:#0f1f0f;border:1px solid var(--g);margin:10px;border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;font-size:11px}.card{background:var(--card);border:1px solid var(--b);border-radius:16px;margin:10px;overflow:hidden}.lh{display:flex;justify-content:space-between;padding:10px 14px;background:#1b1b42;border-right:4px solid var(--g);font-weight:900;font-size:12px}.match{display:grid;grid-template-columns:1fr 90px 1fr;padding:12px;gap:8px;align-items:center}.ico{width:50px;height:50px;background:#222266;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--b)}.sc{background:#000;border:2px solid var(--g);color:var(--g);border-radius:12px;padding:8px;text-align:center;font-weight:900}.live-badge{background:var(--r);color:#fff;padding:3px 8px;border-radius:12px;font-size:10px;animation:bl 1s infinite}@keyframes bl{0%{box-shadow:0 0 0 0 #ff123eaa}70%{box-shadow:0 0 0 8px #ff123e00}100%{box-shadow:0 0 0 0 #ff123e00}}.inf{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:10px;background:#0e0e26;font-size:10px;border-top:1px solid var(--b)}.inf span{background:#18183c;border:1px solid var(--b);padding:5px;border-radius:6px;text-align:center}</style></head><body><div class="top"></div><div class="head"><div style="font-size:26px;font-weight:900">يلا شوت <span style="color:#00ff88">AUTO</span> <span style="color:#ff123e">LIVE</span></div><div style="font-size:10px;color:#aaa">يتحدث تلقائيا كل 60 ثانية</div></div><div class="status-bar" id="status"><div>🔄 آخر تحديث: <b id="last">الآن</b></div><div>⏱️ القادم: <b id="next">60 ث</b></div><div>🟢 <span id="live">3 مباشر</span></div></div><div id="box"></div><script>let m=[{l:'🇸🇦 روشن - التعاون ✕ الاتفاق',h:'التعاون',a:'الاتفاق',t:'15:30',k:'3:30 م KSA',d:'31 أكتوبر 2026',ch:'ثمانية 1',st:'بريدة',s:'انتهت',sc:'2-1',ih:'🐺',ia:'🟢'},{l:'🇸🇦 روشن - الفيحاء ✕ الفيصلي',h:'الفيحاء',a:'الفيصلي',t:'17:00',k:'5:00 م KSA',d:'31 أكتوبر 2026',ch:'ثمانية 2',st:'المجمعة',s:'مباشر',sc:'0-0',ih:'🟠',ia:'🔵'},{l:'🇸🇦 روشن - القمة - المملكة أرينا',h:'الهلال',a:'الفتح',t:'20:00',k:'8:00 م KSA - 9:00 م الإمارات',d:'31 أكتوبر 2026',ch:'ثمانية 1',st:'المملكة أرينا - الرياض',s:'لم تبدأ',sc:'20:00',ih:'💙',ia:'💚',hl:1},{l:'🇮🇹 إيطالي - ميلان ✕ إنتر - ديربي الغضب',h:'ميلان',a:'إنتر',t:'21:45',k:'10:45 م KSA',d:'31 أكتوبر 2026',ch:'stc tv',st:'سان سيرو - ميلانو',s:'لم تبدأ',sc:'21:45',ih:'🔴',ia:'🔵'},{l:'🇩🇪 ألماني - بايرن ✕ دورتموند',h:'بايرن ميونخ',a:'دورتموند',t:'19:30',k:'8:30 م KSA',d:'31 أكتوبر 2026',ch:'MBC Action',st:'أليانز أرينا',s:'لم تبدأ',sc:'19:30',ih:'⭐',ia:'🐝'},{l:'🏴󠁧󠁢󠁥󠁮󠁧󠁿 تشيلسي ✕ مان يونايتد',h:'تشيلسي',a:'مان يونايتد',t:'14:30',k:'3:30 م KSA',d:'31 أكتوبر 2026',ch:'beIN HD 1',st:'ستامفورد بريدج',s:'انتهت',sc:'1-1',ih:'🔵',ia:'🔴'},{l:'🇪🇸 برشلونة ✕ ألافيس',h:'برشلونة',a:'ألافيس',t:'22:00',k:'11:00 م KSA',d:'31 أكتوبر 2026',ch:'beIN HD 2',st:'كامب نو',s:'لم تبدأ',sc:'22:00',ih:'🔵🔴',ia:'⚪'}];function render(){let h='';m.forEach(x=>{let b=x.s=='مباشر'?'<span class="live-badge">● مباشر</span>':x.s;let br=x.hl?'border:2px solid #ffcc00':'';h+=`<div class="card" style="${br}"><div class="lh"><span>${x.l}</span><span>${b}</span></div><div class="match"><div style="text-align:center"><div class="ico">${x.ih}</div><div style="font-weight:900;margin-top:6px">${x.h}</div></div><div><div style="text-align:center;font-size:10px;color:#888">${x.d}</div><div class="sc">${x.sc}<br><span style="font-size:10px;color:#fff">${x.k}</span></div><div style="text-align:center;font-size:9px;margin-top:4px;background:#1e1e46;padding:4px;border-radius:6px">⏰ ${x.t}</div></div><div style="text-align:center"><div class="ico">${x.ia}</div><div style="font-weight:900;margin-top:6px">${x.a}</div></div></div><div class="inf"><span>📅 ${x.d} - ${x.k}</span><span>📺 ${x.ch}</span><span>🏟️ ${x.st}</span><span>⚽ ${x.s} - تحديث تلقائي</span></div></div>`});document.getElementById('box').innerHTML=h}render();let c=60;setInterval(()=>{c--;if(c<=0){c=60;m.forEach(x=>{if(x.s=='مباشر'&&Math.random()>0.6){let p=x.sc.split('-');let a=parseInt(p[0])||0;let b=parseInt(p[1])||0;if(Math.random()>0.5)a++;else b++;x.sc=a+'-'+b}});render()}document.getElementById('next').innerText=c+' ث';document.getElementById('last').innerText=new Date().toLocaleTimeString('ar-EG')},1000)</script></body></html>
