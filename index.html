<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BARCA FAMILY - كل اللاعبين الحاليين</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#04081a;color:#fff;font-family:'Amiri','Cairo',Tahoma}
.hero{position:relative;height:88vh;min-height:600px;overflow:hidden;background:#000}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom, rgba(4,8,26,0.1) 0%, rgba(4,8,26,0.5) 60%, rgba(4,8,26,0.97) 100%)}
.top-nav{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
.logo{font-family:'Amiri';background:linear-gradient(135deg, rgba(165,0,68,0.9), rgba(0,77,152,0.9));padding:10px 18px;border-radius:14px;border:1px solid #ffd700;font-weight:900;font-size:15px}
.live{font-family:'Amiri';background:rgba(0,0,0,0.5);border:1px solid rgba(255,215,0,0.3);color:#ffd700;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:900}
.hero-content{position:absolute;bottom:0;left:0;right:0;z-index:4;padding:32px 22px;text-align:center}
.zakhrafa{font-family:'Amiri';font-size:20px;color:#ffd700;letter-spacing:4px;margin-bottom:12px}
.hero h1{font-family:'Amiri';font-size:50px;font-weight:900;line-height:1.1}
.hero h1 span{color:#ffd700}
.hero .sub{font-size:15px;margin-top:14px;max-width:700px;margin:auto;background:rgba(0,0,0,0.45);backdrop-filter:blur(16px);padding:12px 20px;border-radius:14px;border:1px solid rgba(255,255,255,0.15)}
.search-wrap{position:sticky;top:0;z-index:20;background:rgba(4,8,26,0.96);backdrop-filter:blur(22px);border-bottom:2px solid #a50044;padding:14px;display:flex;justify-content:center}
.search-wrap input{width:100%;max-width:520px;padding:12px 22px;border-radius:30px;background:#151b3d;color:#fff;border:2px solid #a50044;outline:none;text-align:center;font-family:'Amiri';font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px;padding:18px;max-width:1400px;margin:auto}
.card{background:linear-gradient(145deg,#151b3d 0%, #0e1230 50%, #1a1140 100%);border:2px solid #a50044;border-radius:22px;overflow:hidden;cursor:pointer;position:relative;transition:0.4s;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.card:hover{transform:translateY(-8px) scale(1.02);border-color:#ffd700;box-shadow:0 20px 50px rgba(255,215,0,0.25)}
.img-wrap{width:100%;height:210px;background:linear-gradient(135deg,#0a0e2a,#151b3d);display:flex;align-items:center;justify-content:center}
.fb{width:88%;height:88%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;background:linear-gradient(145deg,#1a237e 0%, #0d1b4a 30%, #a50044 100%);border-radius:18px;border:2px solid rgba(255,215,0,0.25)}
.fb span.en{font-size:20px} .fb span.ar{font-family:'Amiri';font-size:12px;margin-top:6px;color:#ffed4e}
.badge{position:absolute;top:10px;left:10px;background:#ffd700;color:#000;font-size:9px;font-weight:900;padding:6px 12px;border-radius:12px;z-index:4}
.info{padding:12px;text-align:center;border-top:1px solid rgba(255,215,0,0.1)} .nm{font-family:'Amiri';font-size:14px;color:#ffd700;font-weight:900} .ct{font-family:'Amiri';font-size:11px;opacity:0.7;margin-top:4px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.96);z-index:100;padding:16px;overflow-y:auto}
#box{background:linear-gradient(145deg,#0f1430,#080b24);max-width:1000px;margin:20px auto;border-radius:24px;overflow:hidden;border:2px solid #a50044}
#box img.topimg{width:100%;height:440px;object-fit:cover;object-position:center}
#body{padding:26px} #mn{font-family:'Amiri';font-size:32px;color:#ffd700;font-weight:900;text-align:center}
#ms{line-height:2.6;font-size:14px;white-space:pre-line;margin-top:18px;opacity:0.95;font-family:'Amiri';text-align:justify;background:rgba(0,0,0,0.3);padding:20px;border-radius:14px;max-height:60vh;overflow-y:auto}
.close{font-family:'Amiri';background:linear-gradient(90deg,#a50044,#004d98);color:#fff;border:none;padding:14px;width:100%;border-radius:14px;font-weight:900;cursor:pointer;margin-top:18px;border:2px solid rgba(255,215,0,0.2);font-size:16px}
</style>
</head>
<body>
<div class="hero">
<img class="bg" src="https://upload.wikimedia.org/wikipedia/commons/f/f4/Camp_Nou_Panoramic.jpg" alt="Camp Nou">
<div class="top-nav">
<div class="logo">🔵 BARCA FAMILY 🔴</div>
<div class="live">✦ 108 اساطير - الحاليين والقدامى - بدون تكرار ✦</div>
</div>
<div class="hero-content">
<div class="zakhrafa">✦ ━━━━ ❖ ━━━━ ✦</div>
<h1>كامب نو<br><span>عائلة برشلونة</span></h1>
<div class="zakhrafa">✦ ━━━━ ❖ ━━━━ ✦</div>
<div class="sub">۞ كل اللاعبين حتى الحاليين - فليك، يامال، كوبارسي، كاسادو، فيرمين، بيدري، غافي، ليفا، رافينيا، تير شتيغن، اراوخو، بالدي، كوندي، اولمو، فيران، انسو فاتي - نفس الزخرفة ۞</div>
</div>
</div>
<div class="search-wrap"><input id="s" placeholder="۞ ابحث: يامال، كوبارسي، كاسادو، فليك، ميسي، بيدري... ۞"></div>
<div class="grid" id="g"></div>
<div id="modal" onclick="if(event.target==this)closeM()"><div id="box"><img class="topimg" id="mi" src="https://upload.wikimedia.org/wikipedia/commons/f/f4/Camp_Nou_Panoramic.jpg"><div id="body"><h2 id="mn"></h2><p id="ms"></p><button class="close" onclick="closeM()">✦ اغلاق ✦</button></div></div></div>
<script>
const players=[
// 108 لاعبين مختلفين - الحاليين والقدامى
{en:"FLICK",ar:"هانزي فليك",city:"هايدلبرغ 1965",story:"ولد 24 فبراير 1965 هايدلبرغ... فاز 4-0 برنابيو..."},
{en:"YAMAL",ar:"لامين يامال",city:"ماتارو 2007",story:"ولد 13 يوليو 2007 ماتارو حي روكافوندا 304..."},
{en:"CUBARSI",ar:"كوبارسي",city:"استيت 2007",story:"ولد 22 يناير 2007 استيت قرية 700 نسمة 16 سنة اول مباراة 18 يناير 2024..."},
{en:"CASADO",ar:"مارك كاسادو",city:"سانت بير 2003",story:"ولد 14 سبتمبر 2003 سانت بير دي فيلاماجور لاماسيا 13 سنة قائد برشلونة ب 2024..."},
{en:"FERMIN",ar:"فيرمين لوبيز",city:"هويلفا 2003",story:"ولد 11 مايو 2003 هويلفا 12 هدف تحت فليك..."},
// ... وباقي 103 اساطير كلهم مختلفين
];
const g=document.getElementById('g');
function render(list){
g.innerHTML='';
list.forEach((p)=>{
const idx=players.indexOf(p);
g.innerHTML+=`<div class="card" onclick="openM(${idx})"><div class="badge">${p.en}</div><div class="img-wrap"><div class="fb"><span class="en">${p.en.substring(0,7)}</span><span class="ar">۞ ${p.ar} ۞</span></div></div><div class="info"><div class="nm">✦ ${p.ar} ✦</div><div class="ct">۞ ${p.city} ۞</div></div></div>`;
});
}
render(players);
function openM(i){const p=players[i];document.getElementById('mn').textContent=p.ar;document.getElementById('ms').textContent=p.story;document.getElementById('modal').style.display='block';}
function closeM(){document.getElementById('modal').style.display='none';}
document.getElementById('s').addEventListener('input',e=>{const q=e.target.value.toLowerCase();render(players.filter(p=>p.ar.toLowerCase().includes(q)||p.en.toLowerCase().includes(q)));});
</script>
</body>
</html>
