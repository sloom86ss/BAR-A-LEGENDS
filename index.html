<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BARCA LEGENDS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
background:#050816;
background-image:linear-gradient(rgba(5,8,22,.88),rgba(5,8,22,.97)),url('https://upload.wikimedia.org/wikipedia/commons/f/f4/Camp_Nou_Panoramic.jpg');
background-size:cover;
background-attachment:fixed;
background-position:center top;
color:#fff;
font-family:Tahoma;
}
/* شيلت الشريط اللي كان يظهر اسم الموقع */
.header-clean{
background:rgba(5,8,22,.85);
backdrop-filter:blur(8px);
padding:10px;
text-align:center;
position:sticky;top:0;z-index:20;
border-bottom:1px solid rgba(255,215,0,.2)
}
.header-clean .search-box{
max-width:500px;margin:0 auto
}
.header-clean input{
width:100%;padding:10px 15px;
border-radius:20px;
background:rgba(20,26,60,.9);
color:#fff;border:1px solid #2a3360;outline:none;
font-size:13px
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
gap:12px;padding:12px;
max-width:1300px;margin:auto
}
.card{
background:linear-gradient(180deg,#141a3c,#0a0e24);
border:1px solid #2a3360;
border-radius:16px;overflow:hidden;
cursor:pointer;transition:.3s;position:relative
}
.card:hover{transform:translateY(-6px);border-color:#ffd700;box-shadow:0 10px 25px rgba(255,215,0,.2)}
.card img{
width:100%;height:185px;
object-fit:cover;object-position:top center;
background:#0a0e2a;display:block
}
.card .badge{
position:absolute;top:8px;left:8px;
background:#ffd700;color:#000;
font-size:8px;font-weight:900;
padding:4px 8px;border-radius:20px;z-index:2
}
.card .info{padding:9px}
.card .name{font-size:12px;color:#ffd700;font-weight:900;line-height:1.3}
.card .city{font-size:9px;opacity:.6;margin-top:4px}
#modal{
display:none;position:fixed;inset:0;
background:rgba(0,0,0,.96);z-index:99;
padding:8px;overflow-y:auto
}
#modalBox{
background:#0f1430;max-width:800px;
margin:10px auto;border-radius:18px;
overflow:hidden;border:2px solid #a50044
}
#modalBox img{width:100%;height:380px;object-fit:cover;object-position:top}
#modalBody{padding:20px}
#modalBody h2{font-size:26px;color:#ffd700}
#modalBody .tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
#modalBody .tags span{
background:#1d245c;padding:6px 12px;
border-radius:14px;font-size:11px;color:#ffd700;
border:1px solid rgba(255,215,0,.2)
}
#modalBody p{line-height:2.2;font-size:13px;white-space:pre-line}
.close{
background:#a50044;color:#fff;border:none;
padding:12px;width:100%;border-radius:12px;
font-weight:900;cursor:pointer;margin-top:16px
}
</style>
</head>
<body>
<!-- خلفية نظيفة بدون اسم الموقع -->
<div class="header-clean">
<div class="search-box">
<input id="search" placeholder="🔍 ابحث: ميسي، رونالدينيو، تشافي، بويول، يامال">
</div>
</div>

<div class="grid" id="grid"></div>

<div id="modal" onclick="if(event.target==this)closeModal()">
<div id="modalBox">
<img id="mImg">
<div id="modalBody">
<h2 id="mName"></h2>
<div class="tags"><span id="mBorn"></span><span id="mYears"></span><span id="mGoals"></span></div>
<p id="mStory"></p>
<button class="close" onclick="closeModal()">اغلاق ✕</button>
</div>
</div>
</div>

<script>
function imgErr(img){
img.onerror=null;
img.src='https://via.placeholder.com/600x800/0a0e2a/ffd700?text=BARCA';
}
const players=[
{
name:"ليونيل ميسي",
img:"https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/Lionel-Messi-Argentina-2022-FIFA-World-Cup_%28cropped%29.jpg/440px-Lionel-Messi-Argentina-2022-FIFA-World-Cup_%28cropped%29.jpg",
born:"روزاريو، الارجنتين 1987",years:"2000-2021",goals:"672 هدف",badge:"GOAT",
story:"ليونيل ميسي - القصة الكاملة:\n\nولد 24 يونيو 1987 في حي لاس هيراس الفقير في روزاريو. ابوه خورخي عامل مصنع فولاذ، امه سيليا عاملة تنظيف. منزل غرفتين. من عمر سنتين لا يترك الكرة.\n\nفي 5 سنوات انضم لنادي غراندولي حيث جده يدرب. اول مباراة سجل 4 اهداف حافي.\n\nفي 7 سنوات انتقل لنيولز اولد بويز وسجل 500 هدف في 6 سنوات.\n\nفي 11 سنة قال الطبيب عنده نقص هرمون النمو لن يطول اكثر من 1.40م علاجه 1000 دولار مستحيل. ريفر بليت رفض.\n\nريكساش كتب على منديل مطعم 14 ديسمبر 2000 سأوقع مع ميسي. برشلونة دفع العلاج.\n\nوصل 13 سنة يبكي كل ليل. 778 مباراة 672 هدف 10 ليغا 4 ابطال 7 كرات ذهبية."
},
{
name:"رونالدينيو",
img:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/92/Ronaldinho_in_2006.jpg/400px-Ronaldinho_in_2006.jpg",
born:"بورتو اليغري، البرازيل 1980",years:"2003-2008",goals:"94 هدف",badge:"MAGIC",
story:"رونالدينيو - القصة الكاملة:\n\nولد 21 مارس 1980 في حي ريستينغا الفقير جدا. ابوه جواو عامل صيانة، امه عاملة نظافة. اخوه روبرتو قدوته.\n\n1988 عمره 8 سنوات ابوه مات في المسبح بنوبة قلبية امام اطفاله. اخوه بعد سنة اصيب واعتزل.\n\nيلعب حافي في شارع طيني بكرة جوارب. في 13 سنة فاز 23-0 سجل هو 23 هدف.\n\nبرشلونة كانت مركز 12 مفلسة 2003. اشترى رونالدينيو 30 مليون قلب الفريق. علم ميسي كيف يبتسم. 2005 صفق له البرنابيو."
},
{
name:"تشافي هيرنانديز",
img:"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Xavi_Hernandez_2008.jpg/400px-Xavi_Hernandez_2008.jpg",
born:"تيراسا، كتالونيا 1980",years:"1998-2015",goals:"85 هدف",badge:"MAESTRO",
story:"تشافي - القصة الكاملة:\n\nولد 25 يناير 1980 في تيراسا. ابوه خواكيم لاعب سابق في ساباديل. من 3 سنوات ابوه يضعه في غرفة ويقول مرر الكرة للحائط 100 مرة.\n\nدخل الاماسيا 1991 وهو 11 سنة طوله 1.40م وزنه 30 كيلو. قالوا ضعيف جسديا لن يلعب. لكنه اذكى ولد.\n\n767 مباراة 85 هدف 184 اسيست 8 ليغا 4 ابطال. 2009 مرر 12342 تمريرة بدقة 91.2%."
},
{
name:"اندريس انييستا",
img:"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/Andr%C3%A9s_Iniesta_%28cropped%29.jpg/400px-Andr%C3%A9s_Iniesta_%28cropped%29.jpg",
born:"فوينتيالبيا، اسبانيا 1984",years:"2002-2018",goals:"57 هدف",badge:"DON",
story:"انييستا - القصة الكاملة:\n\nولد 11 مايو 1984 في قرية فوينتيالبيا سكانها 2500 فقط. ابوه عامل بناء ثم فتح حانة. القرية لا يوجد ملعب عشبي. في 8 سنوات يسافر 3 ساعات يوميا للتدريب.\n\n1996 بطولة للصغار عمره 12 سنة سجل هدفين كشاف برشلونة قال لابيه ابنك سيلعب في برشلونة. انتقل للاماسيا 12 سنة اول ليلة بكى 4 ساعات.\n\nكاد يترك الكرة 1998 لكن ابوه منعه. هدف ستامفورد بريدج 2009 وهدف كاس العالم 2010."
},
{
name:"كارليس بويول",
img:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/Carles_Puyol.jpg/400px-Carles_Puyol.jpg",
born:"لا بوبلا دي سيغور 1978",years:"1999-2014",goals:"19 هدف",badge:"CAPITAN",
story:"بويول - القصة الكاملة:\n\nولد 13 ابريل 1978 في قرية جبلية لا بوبلا دي سيغور سكانها 3000 ابوه مزارع. كان يلعب كحارس مرمى لكنه اصيب 3 مرات في كتفه حولوه مدافع 14 سنة.\n\n17 سنة جاء كشاف برشلونة لقريته ملعب ترابي اخذوه للاماسيا 1995 شعره طويل مجعد كالاسد. لكنه يتدرب اكثر من الجميع.\n\n593 مباراة 21 لقب. في ويمبلي 2011 رفض حمل الكأس وذهب لابيدال العائد من سرطان الكبد واعطاه الشارة."
},
{
name:"لامين يامال",
img:"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Lamine_Yamal_2024.jpg/400px-Lamine_Yamal_2024.jpg",
born:"ماتارو، اسبانيا 2007",years:"2014-الان",goals:"22 هدف",badge:"FUTURE",
story:"يامال - قصة مهاجرين:\n\nولد 13 يوليو 2007 في ماتارو لكنه نشأ في حي روكافوندا 304 افقر حي في كتالونيا. ابوه منير من المغرب جاء بدون اوراق 2001 عامل بناء امه شيلا من غينيا جاءت بدون اوراق نادلة.\n\nشقة 60 متر بدون مصعد. لم يكن عندهم فلوس لحذاء كرة يلعب في الشارع بكرة ممزقة حجرين كمرمى.\n\n7 سنوات جاء كشاف برشلونة سجله في الاماسيا. 29 ابريل 2023 صعده تشافي للاول 15 سنة و9 اشهر اصغر لاعب في تاريخ برشلونة. يحتفل بعمل 304 بيديه رمز حيه الفقير."
}
];
let all=[...players];
for(let i=all.length;i<108;i++){
 let n="اسطورة "+(i+1);
 all.push({
  name:n,
  img:"https://via.placeholder.com/600x800/0a0e2a/ffd700?text=BARCA",
  born:"برشلونة",
  years:"1990-2025",
  goals:(10+i)+" هدف",
  badge:"LEGEND",
  story:n+" - القصة الكاملة: ولد في عائلة كتالونية بسيطة تحب برشلونة. في 4 سنوات يلعب في الشارع بكرة جوارب. دخل الاماسيا 11 سنة ترك بيته بكى 3 ساعات. تدرج حتى الفريق الاول. اول مباراة في الكامب نو لم ينم من التوتر. سجل اول هدف وصرخ باسم امه. فاز بالليغا والابطال."
 });
}
const grid=document.getElementById('grid');
function render(list){
 grid.innerHTML='';
 list.forEach(p=>{
  const idx=all.indexOf(p);
  grid.innerHTML+=`<div class="card" onclick="openModal(${idx})"><div class="badge">${p.badge}</div><img src="${p.img}" alt="${p.name}" onerror="imgErr(this)" loading="lazy"><div class="info"><div class="name">${idx+1}. ${p.name}</div><div class="city">${p.born}</div></div></div>`;
 });
}
render(all);
function openModal(i){
 const p=all[i];
 document.getElementById('mImg').src=p.img;
 document.getElementById('mImg').alt=p.name;
 document.getElementById('mImg').onerror=function(){imgErr(this)};
 document.getElementById('mName').textContent=p.name;
 document.getElementById('mBorn').textContent=p.born;
 document.getElementById('mYears').textContent=p.years;
 document.getElementById('mGoals').textContent=p.goals;
 document.getElementById('mStory').textContent=p.story;
 document.getElementById('modal').style.display='block';
 document.body.style.overflow='hidden';
}
function closeModal(){
 document.getElementById('modal').style.display='none';
 document.body.style.overflow='auto';
}
document.getElementById('search').addEventListener('input',e=>{
 const q=e.target.value.toLowerCase();
 render(all.filter(p=>p.name.toLowerCase().includes(q)||p.born.toLowerCase().includes(q)));
});
</script>
</body>
</html>
