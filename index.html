<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أساطير برشلونة - القصص الخالدة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#070b22;color:#fff;line-height:1.8;
background-image:radial-gradient(circle at 20% 20%, rgba(0,77,152,.15), transparent 50%),
radial-gradient(circle at 80% 80%, rgba(165,0,68,.15), transparent 50%)}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#004d98,#a50044);
padding:16px;text-align:center;border-bottom:3px solid #ffed00}
.top h1{font-size:22px;font-weight:900}.top h1 span{color:#ffed00}
.grid{display:grid;grid-template-columns:1fr;gap:16px;padding:14px;max-width:650px;margin:auto}
@media(min-width:550px){.grid{grid-template-columns:1fr 1fr}}
.card{background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.01)), #12193b;
border:1px solid rgba(255,237,0,.18);border-radius:22px;overflow:hidden;cursor:pointer}
.card-img{height:220px;position:relative;background:#0e1435}
.card-img img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:12px;right:12px;z-index:2;background:rgba(0,0,0,.65);
border:1px solid rgba(255,255,255,.18);padding:5px 12px;border-radius:20px;font-size:10px;font-weight:900}
.badge.gold{background:linear-gradient(90deg,#ffed00,#ffae00);color:#000;border:none}
.card-body{padding:12px 14px 16px}.card-body h3{font-size:17px;font-weight:900
