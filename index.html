<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>108 أساطير برشلونة</title><style>body{background:#0a0e27;color:#fff;font-family:system-ui;margin:0;text-align:center}header{background:linear-gradient(90deg,#a50044,#004d98);padding:30px;font-size:28px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;padding:15px}.card{background:#151a3a;border-radius:12px;padding:8px;animation:f 2s infinite alternate}.card img{width:100%;height:120px;object-fit:cover;border-radius:8px}@keyframes f{0%{transform:scale(1)}100%{transform:scale(1.05)}}.name{font-size:12px;margin-top:6px;font-weight:700}</style></head><body><header>🔵 108 أساطير برشلونة 🔴<br>LEGENDS</header><div class="grid" id="g"></div><script>const n=["ميسي","رونالدينيو","تشافي","انييستا","بويول","بيكيه","سواريز","نيمار","كرويف","مارادونا","رونالدو","ريفالدو","ايتو","هنري","فيا","بيدري","جافي","ليفا","شتيغن","بوسكيتس","الفيس","ابيدال","ماسكيرانو","راكيتيتش","البا","اومتيتي","ديمبلي","كوتينيو","غريزمان","دي يونغ","اراوخو","كوندي","بالدي","يامال","فيرمين","كوبارسي","كاسادو","اولمو","توريس","رافينيا"];let g=document.getElementById("g");for(let i=0;i<108;i++){let name=n[i%n.length]+" "+(i+1);g.innerHTML+=`<div class=card><img src=https://picsum.photos/seed/b${i}/200/200><div class=name>${name}</div></div>`}</script></body></html
